<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haftalık Planlayıcı 2026–2030</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#e9edf2;--bar:#ffffff;--bar-ink:#1d2433;--bar-line:#cfd5df;--acc:#0f766e;--tab:#d3dce7;--tab-ink:#1d2433;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141b;--bar:#1a212c;--bar-ink:#e8edf4;--bar-line:#2c3646;--tab:#2c3646;--tab-ink:#e8edf4}}
:root[data-theme="dark"]{--bg:#10141b;--bar:#1a212c;--bar-ink:#e8edf4;--bar-line:#2c3646;--tab:#2c3646;--tab-ink:#e8edf4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);font-family:'IBM Plex Sans','Segoe UI',sans-serif}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px 16px;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--bar-line)}
#bar button,#bar select{font:inherit;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--bar-line);background:var(--bar);color:var(--bar-ink);cursor:pointer;min-height:40px}
#bar button:disabled{opacity:.45;cursor:default}
#bar button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
#bar .hint{font-size:12px;opacity:.7}
#wrap{display:flex;justify-content:safe center;align-items:flex-start;margin:16px auto;padding:0 12px;box-sizing:border-box}
#stage{overflow:hidden;flex:none}
#tabs{flex:none;width:118px;display:flex;flex-direction:column;gap:6px;padding-top:24px}
.zm{display:flex;gap:4px}
#bar .zm button{padding:8px 12px;min-width:44px}
.tab{appearance:none;-webkit-appearance:none;border:0;font:inherit;font-size:13px;text-align:left;padding:10px 10px 10px 12px;border-radius:0 8px 8px 0;background:var(--tab);color:var(--tab-ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;box-sizing:border-box}
.tab:hover{filter:brightness(.95)}
.tabrow{display:flex;align-items:stretch;gap:2px;width:100%}
.tabrow .tab{flex:1;width:auto;min-width:0}
.tabmove{appearance:none;-webkit-appearance:none;border:0;border-radius:4px;background:var(--tab);color:var(--tab-ink);font:inherit;font-size:12px;line-height:1;width:20px;flex:none;cursor:pointer;padding:0}
.tabmove:hover{filter:brightness(.92)}
.tabmove:disabled{opacity:.25;cursor:default}
.tab.on{background:var(--acc);color:#fff;font-weight:700}
#sheet{width:1123px;height:794px;box-sizing:border-box;padding:32px;display:flex;flex-direction:column;gap:14px;background:#fff;color:#1d2433;transform-origin:top left;box-shadow:0 4px 24px rgba(0,0,0,.18)}
.df{font-family:'Bricolage Grotesque','Segoe UI',sans-serif}
.top{display:flex;gap:14px;align-items:stretch}
.title{width:330px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1d2433;padding-bottom:8px}
.lab{font-size:11px;letter-spacing:3px;font-weight:700;color:#0f766e}
.dt{font-size:28px;font-weight:700;line-height:1.1;margin-top:4px}
.num{font-size:46px;font-weight:700;line-height:1;color:#0f766e;text-align:right}
.numl{font-size:10px;font-weight:700;letter-spacing:2px;text-align:right}
.panel{border:1px solid #cfd5df;border-radius:6px;padding:7px 10px}
.pl{font-size:10px;font-weight:700;letter-spacing:2px;margin-bottom:6px}
.g{display:grid;gap:2px}
.mc{padding:7px 0;text-align:center;font-size:11px;font-weight:500;border-radius:4px}
.wc{padding:4px 0;text-align:center;border-radius:4px}
.on{background:#0f766e;color:#fff;font-weight:700}
.days{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;min-height:0}
.day{border:1px solid #cfd5df;border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:baseline;background:#f1f4f8;padding:8px 12px;border-bottom:1px solid #cfd5df}
.dh b{font-size:16px}.dh span{font-size:13px;color:#0f766e;font-weight:700}
.ln{flex:1;border-bottom:1px solid #e1e5ec;display:flex;align-items:center;gap:8px;padding:0 8px}
.ln:last-child{border-bottom:0}
input[type=text]{font:inherit;font-size:13px;color:#1d2433;border:0;background:transparent;outline:none;width:100%;min-width:0;padding:0 10px}
input[type=text]:focus{background:rgba(15,118,110,.07)}
.ln input[type=text]{height:100%;padding:0 2px}
input[type=date]{font:inherit;font-size:13px;color:#1d2433;border:1px solid #cfd5df;border-radius:4px;background:#fff;height:28px;width:132px;box-sizing:border-box;padding:0 6px;flex:none}
.x{appearance:none;-webkit-appearance:none;flex:none;border:0;background:transparent;color:#aab2bf;font:inherit;font-size:18px;line-height:1;width:22px;height:22px;border-radius:4px;cursor:pointer;padding:0}
.x:hover,.x:focus-visible{color:#b42318;background:rgba(180,35,24,.08);outline:none}
.hover-tip{position:fixed;z-index:9999;display:none;max-width:min(520px,calc(100vw - 24px));padding:7px 10px;border:1px solid #cfd5df;border-radius:5px;background:#fff;color:#1d2433;box-shadow:0 3px 12px rgba(0,0,0,.18);font:13px/1.45 'IBM Plex Sans','Segoe UI',sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none}
.fu{flex:1;border:1.5px solid #0f766e;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.fh{background:#0f766e;color:#fff;padding:8px 14px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.arw{margin-left:auto;display:flex;gap:6px}
.ar{appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.65);background:transparent;color:#fff;font:inherit;font-size:18px;line-height:1;width:34px;height:24px;border-radius:4px;cursor:pointer;padding:0}
.ar:hover{background:rgba(255,255,255,.2)}
.ar:disabled{opacity:.35;cursor:default}
.cols{flex:1;display:flex;min-height:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.cols::-webkit-scrollbar{display:none}
.col{flex:0 0 33.3333%;box-sizing:border-box;scroll-snap-align:start;display:flex;flex-direction:column;padding:0 14px}
.col+.col{border-left:1.5px solid #0f766e}
.row{flex:1;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e1e5ec}
.row:last-child{border-bottom:0}
.row input[type=text]{height:100%;padding:0 4px;font-size:14px}
.cb{appearance:none;-webkit-appearance:none;flex:none;width:16px;height:16px;margin:0;border:1.5px solid #0f766e;border-radius:3px;background:#fff;cursor:pointer;display:grid;place-content:center}
.cb:checked{background:#0f766e}
.cb:checked::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb:checked + .tx{text-decoration:line-through;text-decoration-thickness:1.5px;color:#8a94a3}
.cb:checked ~ input[type=date]{color:#8a94a3}
.chead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1d2433;padding-bottom:8px}
.cn{font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-size:30px;font-weight:700;color:#1d2433;border:0;background:transparent;outline:none;width:640px;padding:0;margin-top:4px}
.cn:focus{background:rgba(15,118,110,.07)}
.dc{font:inherit;font-size:13px;border:1px solid #cfd5df;background:#fff;color:#b42318;padding:6px 12px;border-radius:6px;cursor:pointer}
.dl{width:132px;flex:none;text-align:center;font-size:11px;letter-spacing:1px;font-weight:700}
.cl{flex:1;overflow-y:auto;padding:0 14px;display:flex;flex-direction:column;min-height:0}
.cl .row{flex:none;height:40px}
.ad{font:inherit;font-size:13px;font-weight:700;border:0;border-top:1px solid #e1e5ec;background:#f6f8fa;color:#0f766e;padding:8px;cursor:pointer}
input.mi{}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:10000;font-family:'IBM Plex Sans','Segoe UI',sans-serif}
.mdl .box{background:#fff;color:#1d2433;border-radius:8px;padding:18px;width:360px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.mdl .mt{font-weight:700;margin-bottom:10px}
.mdl input.mi{width:100%;box-sizing:border-box;border:1px solid #cfd5df;border-radius:6px;padding:8px 10px;font-size:14px;height:auto;background:#fff}
.mdl .mb{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mdl .mb button{font:inherit;font-size:14px;padding:8px 14px;border:1px solid #cfd5df;border-radius:6px;background:#fff;color:#1d2433;cursor:pointer}
.mdl .mb button.pri{background:#0f766e;color:#fff;border-color:#0f766e;font-weight:700}
@media print{
@page{size:A4 landscape;margin:0}
html,body{background:#fff}
#bar,#tabs,.np,.x{display:none!important}
#wrap{display:block;margin:0;padding:0}
#stage{height:auto!important;width:auto!important;overflow:visible}
#sheet{transform:none!important;box-shadow:none}
}
</style>
</head>
<body>
<div id="bar">
<button id="prev" type="button">‹ Önceki hafta</button>
<select id="sel" aria-label="Hafta seç"></select>
<button id="next" type="button">Sonraki hafta ›</button>
<button id="today" type="button">Bu hafta</button>
<span class="zm"><button id="zo" type="button" title="Küçült (Ctrl −)">−</button><button id="zl" type="button" title="Pencereye sığdır (Ctrl 0)">Sığdır</button><button id="zi" type="button" title="Büyüt (Ctrl +)">+</button></span>
<button id="print" type="button" class="pri">Yazdır</button>
<button id="op" type="button" title="Bilgisayarındaki bir kayıt dosyasını aç">Aç</button>
<button id="sv" type="button" title="Notları kayıt dosyasına kaydeder">Kaydet</button>
<button id="sa" type="button" title="Yeni bir dosya adı/konumu seçerek kaydeder">Farklı Kaydet</button>
<button id="ac" type="button">Sayfa Ekle</button>
<input id="rf" type="file" accept=".json,application/json" hidden>
<span id="st" class="hint"></span>
</div>
<div id="wrap"><div id="stage"><div id="sheet"></div></div><div id="tabs"></div></div>
<script>
var SH=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
var FULL=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var DAYS=["Pazartesi","Salı","Çarşamba","Perşembe","Cuma"];
var KEY="haftalik-plan-2026-2030";
function $(i){return document.getElementById(i);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function p2(n){return (n<10?"0":"")+n;}
function dkey(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var M=[];
for(var k=0;;k++){var d0=new Date(2025,11,29+7*k);if(d0.getFullYear()>2031)break;var th=addDays(d0,3),y=th.getFullYear();var doy=Math.round((new Date(y,th.getMonth(),th.getDate())-new Date(y,0,1))/864e5);M.push({d:d0,y:y,w:Math.floor(doy/7)+1});}
var CNT={};M.forEach(function(e){CNT[e.y]=(CNT[e.y]||0)+1;});
var START=new Date(2026,9,12),L=[];
M.forEach(function(e,i){if(e.y<=2030&&e.d>=START)L.push(i);});
function rng(m){var f=addDays(m,4);return m.getMonth()===f.getMonth()?m.getDate()+"–"+f.getDate()+" "+SH[m.getMonth()]:m.getDate()+" "+SH[m.getMonth()]+"–"+f.getDate()+" "+SH[f.getMonth()];}
var S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){S={};}
function saveLocal(clean){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+":dirty",clean?"0":"1");}catch(e){}}
function save(){saveLocal(false);queueFile();}
var cur=0,view="week";
function getList(){return Array.isArray(S["cust:list"])?S["cust:list"]:[];}
function ncols(pre){return S[pre+":ncols"]||3;}
function weekOfToday(){var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());var p=0;for(var q=0;q<L.length;q++){if(t>=M[L[q]].d)p=q;}return p;}
function weekHasData(ix){var pre=dkey(M[ix].d);if(S[pre+":v"])return true;var n=ncols(pre);for(var c=0;c<n;c++)for(var r=0;r<7;r++){if(String(S[pre+":t"+c+":"+r]||"").trim())return true;}return false;}
function doneIn(sp,t){var n=ncols(sp),done=false;for(var c=0;c<n;c++)for(var r=0;r<7;r++){if(String(S[sp+":t"+c+":"+r]||"")===t){if(S[sp+":c"+c+":"+r])done=true;else return false;}}return done;}
function reconcileCarry(upto){var ch=false;
for(var q=0;q<=upto;q++){var pre=dkey(M[L[q]].d);if(S[pre+":v"]!==1)continue;var n=ncols(pre);
for(var c=0;c<n;c++)for(var r=0;r<7;r++){var ok=pre+":o"+c+":"+r,sp=S[ok];if(!sp)continue;
var t=String(S[pre+":t"+c+":"+r]||"");
if(!t){delete S[ok];ch=true;continue;}
if(S[pre+":c"+c+":"+r])continue;
if(doneIn(sp,t)){delete S[pre+":t"+c+":"+r];delete S[pre+":c"+c+":"+r];delete S[ok];ch=true;}}}
if(ch)save();}
function ensureCarry(p){
reconcileCarry(p);
var pre=dkey(M[L[p]].d);if(S[pre+":v"]===1)return;
var src=-1;for(var q=p-1;q>=0;q--){if(weekHasData(L[q])){src=q;break;}}
if(src>=0){
var sp=dkey(M[L[src]].d),sn=ncols(sp),items=[];
for(var c=0;c<sn;c++)for(var r=0;r<7;r++){var t=String(S[sp+":t"+c+":"+r]||"");if(t.trim()&&!S[sp+":c"+c+":"+r])items.push(t);}
if(items.length){
var nc=ncols(pre),slots=[];
for(var c2=0;c2<nc;c2++)for(var r2=0;r2<7;r2++){if(!String(S[pre+":t"+c2+":"+r2]||"").trim())slots.push([c2,r2]);}
while(slots.length<items.length){for(var r3=0;r3<7;r3++)slots.push([nc,r3]);nc++;}
items.forEach(function(t,i){S[pre+":t"+slots[i][0]+":"+slots[i][1]]=t;delete S[pre+":c"+slots[i][0]+":"+slots[i][1]];S[pre+":o"+slots[i][0]+":"+slots[i][1]]=sp;});
if(nc>3)S[pre+":ncols"]=nc;
}
}
S[pre+":v"]=1;save();
}
function build(ix){
var e=M[ix],mon=e.d,fri=addDays(mon,4),anc=addDays(mon,3),Y=e.y,wk=e.w,pre=dkey(mon);
var wd=[0,1,2,3,4].map(function(i){return addDays(mon,i);});
var hm={};wd.forEach(function(d){if(d.getFullYear()===Y)hm[d.getMonth()]=1;});
var title;
if(mon.getMonth()===fri.getMonth())title=mon.getDate()+" – "+fri.getDate()+" "+FULL[mon.getMonth()]+" "+fri.getFullYear();
else if(mon.getFullYear()===fri.getFullYear())title=mon.getDate()+" "+FULL[mon.getMonth()]+" – "+fri.getDate()+" "+FULL[fri.getMonth()]+" "+fri.getFullYear();
else title=mon.getDate()+" "+FULL[mon.getMonth()]+" "+mon.getFullYear()+" – "+fri.getDate()+" "+FULL[fri.getMonth()]+" "+fri.getFullYear();
var tsz=title.length<22?28:19;
var mc=SH.map(function(m,i){return '<div class="mc'+(hm[i]?' on':'')+'">'+m+'</div>';}).join("");
var ws=[];M.forEach(function(x,j){for(var q=0;q<5;q++){var d=addDays(x.d,q);if(d.getMonth()===anc.getMonth()&&d.getFullYear()===Y){ws.push(j);break;}}});
var wc=ws.map(function(j){return '<div class="wc'+(j===ix?' on':'')+'"><div style="font-size:13px;font-weight:700">H'+M[j].w+'</div><div style="font-size:9px">'+rng(M[j].d)+'</div></div>';}).join("");
var days=wd.map(function(d,i){var l="";for(var r=1;r<=9;r++){l+='<div class="ln"><input type="checkbox" class="cb" data-k="'+pre+':dc'+i+':'+r+'" aria-label="Tamamlandı"><input type="text" class="tx" data-k="'+pre+':d'+i+':'+r+'" aria-label="'+DAYS[i]+' not '+r+'"><button type="button" class="x" data-del="d|'+i+'|'+r+'" aria-label="Satırı sil" title="Satırı sil">×</button></div>';}
return '<div class="day"><div class="dh"><b class="df">'+DAYS[i]+'</b><span>'+d.getDate()+' '+SH[d.getMonth()]+'</span></div>'+l+'</div>';}).join("");
var n=ncols(pre),cols="";for(var c=0;c<n;c++){var rows="";for(var r=0;r<7;r++){rows+='<div class="row"><input type="checkbox" class="cb" data-k="'+pre+':c'+c+':'+r+'" aria-label="Tamamlandı"><input type="text" class="tx" data-k="'+pre+':t'+c+':'+r+'" aria-label="Takip konusu"><button type="button" class="x" data-del="t|'+c+'|'+r+'" aria-label="Satırı sil" title="Satırı sil">×</button></div>';}cols+='<div class="col">'+rows+'</div>';}
return '<div class="top"><div class="title"><div><div class="lab">HAFTALIK PLAN</div><div class="dt df" style="font-size:'+tsz+'px">'+title+'</div></div><div><div class="num df">'+wk+'</div><div class="numl">HAFTA / '+CNT[Y]+'</div></div></div>'
+'<div class="panel" style="flex:1"><div class="pl">AY — '+Y+'</div><div class="g" style="grid-template-columns:repeat(12,1fr)">'+mc+'</div></div>'
+'<div class="panel" style="width:300px"><div class="pl">'+FULL[anc.getMonth()].toLocaleUpperCase("tr")+' HAFTALARI</div><div class="g" style="grid-template-columns:repeat('+ws.length+',1fr)">'+wc+'</div></div></div>'
+'<div class="days">'+days+'</div><div class="fu"><div class="fh df"><span>Takip Edilecek Konular</span><span class="arw np"><button type="button" class="ar" data-nav="-1" title="Sola kaydır" aria-label="Sola kaydır">‹</button><button type="button" class="ar" data-nav="1" title="Sağa kaydır (sonda yeni sütun açar)" aria-label="Sağa kaydır">›</button></span></div><div class="cols">'+cols+'</div></div>';
}
function buildCust(c){
var id=c.id,n=S["cust:"+id+":n"]||14,rows="";
for(var r=0;r<n;r++){var b="cust:"+id+":";rows+='<div class="row"><input type="checkbox" class="cb" data-k="'+b+'c:'+r+'" aria-label="Tamamlandı"><input type="text" class="tx" data-k="'+b+'t:'+r+'" aria-label="Konu"><input type="date" data-k="'+b+'a:'+r+'" aria-label="Talep tarihi"><input type="date" data-k="'+b+'b:'+r+'" aria-label="Bitiş tarihi"><button type="button" class="x" data-del="u|'+id+'|'+r+'" aria-label="Satırı sil" title="Satırı sil">×</button></div>';}
return '<div class="chead"><div><div class="lab">SAYFA</div><input id="cname" class="cn" type="text" value="'+esc(c.name)+'" aria-label="Sayfa adı"></div><button type="button" class="dc np" data-delc="'+id+'">Sayfayı sil</button></div>'
+'<div class="fu"><div class="fh df"><span style="flex:1">Takip Edilecek Konular</span><span class="dl">TALEP TARİHİ</span><span class="dl">BİTİŞ TARİHİ</span><span style="width:22px;flex:none"></span></div><div class="cl">'+rows+'</div><button type="button" class="ad np" data-addrow="'+id+'">+ Satır ekle</button></div>';
}
var ZOOM=null;try{var zz=parseFloat(localStorage.getItem(KEY+":zoom"));if(zz>0)ZOOM=zz;}catch(e){}
function autoScale(){var bh=$("bar").offsetHeight||60;return Math.min(1,(window.innerWidth-24)/(1123+118),(window.innerHeight-bh-40)/794);}
function fit(){var s=ZOOM||autoScale();$("stage").style.width=(1123*s)+"px";$("stage").style.height=(794*s)+"px";$("sheet").style.transform="scale("+s+")";$("tabs").style.zoom=s;$("zl").textContent=ZOOM?Math.round(s*100)+"%":"Sığdır";}
function setZoom(z){ZOOM=z;try{if(z)localStorage.setItem(KEY+":zoom",String(z));else localStorage.removeItem(KEY+":zoom");}catch(e){}fit();}
function stepZoom(d){var n=Math.round(((ZOOM||autoScale())+d)*100)/100;setZoom(Math.max(0.4,Math.min(2,n)));}
function restore(sh){sh.querySelectorAll("[data-k]").forEach(function(el){var v=S[el.getAttribute("data-k")];if(v===undefined)return;if(el.type==="checkbox")el.checked=!!v;else el.value=v;});}
function renderTabs(){
var h='<button type="button" class="tab'+(view==="week"?" on":"")+'" data-tab="week">Haftalık Plan</button>',list=getList();
list.forEach(function(c,i){h+='<div class="tabrow"><button type="button" class="tab'+(view===c.id?" on":"")+'" data-tab="'+esc(c.id)+'" title="'+esc(c.name)+'">'+esc(c.name)+'</button><button type="button" class="tabmove" data-move="'+esc(c.id)+'|-1" title="Sayfayı yukarı taşı" aria-label="Sayfayı yukarı taşı"'+(i===0?' disabled':'')+'>↑</button><button type="button" class="tabmove" data-move="'+esc(c.id)+'|1" title="Sayfayı aşağı taşı" aria-label="Sayfayı aşağı taşı"'+(i===list.length-1?' disabled':'')+'>↓</button></div>';});

}
function updNav(){var c=document.querySelector("#sheet .cols"),b=document.querySelector('#sheet [data-nav="-1"]');if(c&&b)b.disabled=c.scrollLeft<=1;}
function render(p,keep){
cur=p;view="week";ensureCarry(p);
var sh=$("sheet"),old=sh.querySelector(".cols"),sl=(keep&&old)?old.scrollLeft:0;
sh.innerHTML=build(L[p]);restore(sh);
var c=sh.querySelector(".cols");if(c){if(sl)c.scrollLeft=sl;c.addEventListener("scroll",updNav);updNav();}

$("sel").value=String(p);$("prev").disabled=p<=0;$("next").disabled=p>=L.length-1;

function showCust(id){
var c=getList().filter(function(x){return x.id===id;})[0];
if(!c){render(cur);return;}
view=id;var sh=$("sheet");sh.innerHTML=buildCust(c);restore(sh);

}
function refresh(){if(view==="week")render(cur,true);else showCust(view);}
function addCol(){var pre=dkey(M[L[cur]].d);S[pre+":ncols"]=ncols(pre)+1;save();render(cur,true);var c=document.querySelector("#sheet .cols");if(c)c.scrollTo({left:c.scrollWidth,behavior:"smooth"});}
function askText(title,def){return new Promise(function(res){
var o=document.createElement("div");o.className="mdl";
o.innerHTML='<div class="box"><div class="mt"></div><input type="text" class="mi" aria-label="Ad"><div class="mb"><button type="button" data-c="1">İptal</button><button type="button" data-o="1" class="pri">Tamam</button></div></div>';
o.querySelector(".mt").textContent=title;var inp=o.querySelector(".mi");inp.value=def||"";
function done(v){o.remove();res(v);}
o.addEventListener("click",function(e){if(e.target===o||e.target.hasAttribute("data-c"))done(null);else if(e.target.hasAttribute("data-o"))done(inp.value);});
inp.addEventListener("keydown",function(e){if(e.key==="Enter")done(inp.value);else if(e.key==="Escape")done(null);});
document.body.appendChild(o);inp.focus();
});}
async function addCustomer(){
var nm=await askText("Sayfa adı","");if(nm===null)return;nm=nm.trim();if(!nm)return;
var id="m"+Date.now().toString(36),l=getList().slice();l.push({id:id,name:nm});S["cust:list"]=l;save();showCust(id);

function delCustomer(id){
var c=getList().filter(function(x){return x.id===id;})[0];if(!c)return;
if(!confirm('"'+c.name+'" sayfası ve tüm satırları silinecek. Devam edilsin mi?'))return;
S["cust:list"]=getList().filter(function(x){return x.id!==id;});
Object.keys(S).forEach(function(k){if(k.indexOf("cust:"+id+":")===0)delete S[k];});
save();render(cur);
}
function delRow(kind,g,r){
var K,last;
if(kind==="u"){var b="cust:"+g+":";K=function(q){return [b+"t:"+q,b+"c:"+q,b+"a:"+q,b+"b:"+q];};last=(S[b+"n"]||14)-1;}
else{var pre=dkey(M[L[cur]].d);
if(kind==="d"){K=function(q){return [pre+":d"+g+":"+q,pre+":dc"+g+":"+q];};last=9;}
else{K=function(q){return [pre+":t"+g+":"+q,pre+":c"+g+":"+q,pre+":o"+g+":"+q];};last=6;}}
var t=S[K(r)[0]]||"";
if(!confirm((t?'"'+t+'" satırı':"Bu satır")+" silinecek ve altındaki satırlar yukarı kayacak. Devam edilsin mi?"))return;
for(var q=r;q<last;q++){var A=K(q+1),B=K(q);for(var i=0;i<A.length;i++){var v=S[A[i]];if(v)S[B[i]]=v;else delete S[B[i]];}}
K(last).forEach(function(k){delete S[k];});
save();if(kind==="u")showCust(g);else render(cur,true);
}
var sheet=$("sheet");

if(el.id==="cname"){var c=getList().filter(function(x){return x.id===view;})[0];if(c){c.name=el.value;save();renderTabs();}return;}
if(!el.getAttribute("data-k"))return;S[el.getAttribute("data-k")]=el.type==="checkbox"?el.checked:el.value;save();});

$("tabs").addEventListener("click",function(e){var move=e.target.closest?e.target.closest("[data-move]"):null;if(move){if(move.disabled)return;var p=move.getAttribute("data-move").split("|"),id=p[0],delta=parseInt(p[1],10),list=getList(),i=list.findIndex(function(c){return c.id===id;}),j=i+delta;if(i<0||j<0||j>=list.length)return;var tmp=list[i];list[i]=list[j];list[j]=tmp;S["cust:list"]=list;save();renderTabs();return;}var b=e.target.closest?e.target.closest("[data-tab]"):null;if(!b)return;var v=b.getAttribute("data-tab");if(v==="week")render(cur);else showCust(v);});
var sel=$("sel"),grp=null,gy=0;
L.forEach(function(ix,p){var e=M[ix];if(e.y!==gy){gy=e.y;grp=document.createElement("optgroup");grp.label=String(gy);sel.appendChild(grp);}var o=document.createElement("option");o.value=String(p);o.textContent=e.w+". Hafta · "+rng(e.d);grp.appendChild(o);});

var NATIVE=!!window.agendaAPI,filePath="";
var fh=null,HK="son-yedek-dosyasi",fileName="",lastSaved=0,perm=false,timer=null;
function idb(cb){try{var r=indexedDB.open("haftalik-plan-db",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv");};r.onsuccess=function(){cb(r.result);};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function idbGet(k,cb){idb(function(db){if(!db)return cb(null);try{var q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){cb(q.result||null);};q.onerror=function(){cb(null);};}catch(e){cb(null);}});}
function idbSet(k,v){idb(function(db){if(!db)return;try{db.transaction("kv","readwrite").objectStore("kv").put(v,k);}catch(e){}});}
var API=NATIVE||!!(window.showSaveFilePicker&&window.showOpenFilePicker);
var PICK={types:[{description:"Haftalık Plan verisi",accept:{"application/json":[".json"]}}]};
function pack(){return JSON.stringify({app:"haftalik-plan",v:2,savedAt:Date.now(),data:S});}
function valid(o){return !!(o&&o.app==="haftalik-plan"&&o.data&&typeof o.data==="object");}
function showStatus(msg){
var st=$("st");
if(msg){st.textContent=msg;return;}
if(NATIVE){var t0=lastSaved?new Date(lastSaved):null;st.textContent="● "+(fileName||"Kayıt dosyası")+" dosyasına otomatik kaydediliyor"+(t0?" · son kayıt "+p2(t0.getHours())+":"+p2(t0.getMinutes()):"");st.title=filePath;return;}
if(!API){st.textContent="Bu tarayıcı doğrudan dosyaya kaydetmeyi desteklemiyor (Edge veya Chrome kullan). Veriler tarayıcıda saklanıyor.";return;}
if(!fh){st.textContent="Kayıt dosyası yok, veriler yalnızca tarayıcıda. “Farklı Kaydet” ile bilgisayarına kaydet.";return;}
if(!perm){st.innerHTML=esc(fileName)+" bağlı ama yazma izni yok. <button type=\"button\" data-grant=\"1\">Dosya iznini ver</button>";return;}
var t=lastSaved?new Date(lastSaved):null;
st.textContent="● "+fileName+" dosyasına otomatik kaydediliyor"+(t?" · son kayıt "+p2(t.getHours())+":"+p2(t.getMinutes()):"");
}
async function hasPerm(ask){
if(!fh)return false;
try{var o={mode:"readwrite"};if((await fh.queryPermission(o))==="granted")return true;if(ask&&(await fh.requestPermission(o))==="granted")return true;}catch(e){}
return false;
}
async function doWrite(){var w=await fh.createWritable();await w.write(pack());await w.close();lastSaved=Date.now();try{localStorage.setItem(KEY+":dirty","0");}catch(e){}perm=true;showStatus();}
async function writeFile(ask){
if(NATIVE){
try{var r=await window.agendaAPI.write(pack());if(!r||!r.ok)throw new Error((r&&r.error)||"yazılamadı");filePath=r.path;fileName=r.name;lastSaved=Date.now();try{localStorage.setItem(KEY+":dirty","0");}catch(e){}perm=true;showStatus();return true;}
catch(e){showStatus("Dosyaya yazılamadı: "+(e&&e.message?e.message:e));return false;}
}
if(!fh)return false;
try{await doWrite();return true;}
catch(e){
var nm=e&&e.name;
if(nm==="NotAllowedError"||nm==="SecurityError"||nm==="InvalidStateError"){
if(ask&&(await hasPerm(true))){try{await doWrite();return true;}catch(e2){}}
perm=false;showStatus();
}else{showStatus("Dosyaya yazılamadı: "+(e&&e.message?e.message:nm));}
return false;
}
}
async function relink(){
try{
var h=await window.showSaveFilePicker(Object.assign({suggestedName:fileName||"Haftalik-Plan-Verisi.json",startIn:fh||"documents"},PICK));
fh=h;fileName=h.name;idbSet(HK,h);return true;
}catch(e){
if(e&&e.name==="AbortError")return false;
showStatus("Dosya seçilemedi: "+(e&&e.message?e.message:(e&&e.name)||"bilinmeyen hata"));return false;
}
}
function queueFile(){if(!fh&&!NATIVE)return;clearTimeout(timer);timer=setTimeout(function(){writeFile(false);},500);}
async function syncFromFile(){
try{
var f=await fh.getFile(),o=JSON.parse(await f.text());
if(!valid(o))return;
if(localStorage.getItem(KEY+":dirty")==="1"){await writeFile(false);}
else{S=o.data;lastSaved=o.savedAt||0;saveLocal(true);refresh();}
}catch(e){}
}
function download(){
var t=new Date(),n="Haftalik-Plan-"+t.getFullYear()+"-"+p2(t.getMonth()+1)+"-"+p2(t.getDate())+".json";
var blob=new Blob([pack()],{type:"application/json"});
var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=n;document.body.appendChild(a);a.click();
setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
var sv=$("sv");
function flash(t){sv.textContent=t;setTimeout(function(){sv.textContent="Kaydet";},1800);}
async function saveAs(){
if(NATIVE){var r=await window.agendaAPI.saveAs(pack());if(r&&r.ok){filePath=r.path;fileName=r.name;lastSaved=Date.now();try{localStorage.setItem(KEY+":dirty","0");}catch(e){}showStatus();flash("Kaydedildi ✓");}return;}
if(!API){download();flash("İndirildi");return;}
try{
var h=await window.showSaveFilePicker(Object.assign({suggestedName:"Haftalik-Plan-Verisi.json",startIn:"documents"},PICK));
fh=h;fileName=h.name;idbSet(HK,h);
var ok=await writeFile(true);flash(ok?"Kaydedildi ✓":"Kaydedilemedi");
}catch(e){if(e&&e.name==="AbortError")return;flash("Kaydedilemedi");}
}
async function openFile(){
if(NATIVE){
var r=await window.agendaAPI.open();if(!r||!r.ok)return;
var o;try{o=JSON.parse(r.text);}catch(e){o=null;}
if(!valid(o)){alert("Bu dosya geçerli bir Haftalık Plan dosyası değil.");return;}
if(!confirm("“"+r.name+"” açılacak. Ekrandaki mevcut veriler dosyadaki verilerle değiştirilecek. Devam edilsin mi?"))return;
await window.agendaAPI.use(r.path);
S=o.data;filePath=r.path;fileName=r.name;saveLocal(true);lastSaved=o.savedAt||0;showStatus();refresh();return;
}
if(!API){rf.value="";rf.click();return;}
try{
var hs=await window.showOpenFilePicker(Object.assign({multiple:false,startIn:"documents"},PICK)),h=hs[0];
var f=await h.getFile(),o;
try{o=JSON.parse(await f.text());}catch(e){o=null;}
if(!valid(o)){alert("Bu dosya geçerli bir Haftalık Plan dosyası değil.");return;}
if(!confirm("“"+f.name+"” açılacak. Ekrandaki mevcut veriler dosyadaki verilerle değiştirilecek. Devam edilsin mi?"))return;
S=o.data;fh=h;fileName=f.name;idbSet(HK,h);saveLocal(true);
perm=await hasPerm(true);lastSaved=o.savedAt||0;showStatus();refresh();
}catch(e){if(e&&e.name==="AbortError")return;alert("Dosya açılamadı.");}
}
var rf=$("rf");
rf.addEventListener("change",function(){
var f=rf.files&&rf.files[0];if(!f)return;
var r=new FileReader();
r.onload=function(){
var o;try{o=JSON.parse(r.result);}catch(e){o=null;}
if(!valid(o)){alert("Bu dosya geçerli bir Haftalık Plan dosyası değil.");return;}
if(!confirm("Ekrandaki mevcut veriler dosyadaki verilerle değiştirilecek. Devam edilsin mi?"))return;
S=o.data;saveLocal(true);refresh();
};
r.readAsText(f);
});
$("op").addEventListener("click",openFile);
$("sa").addEventListener("click",saveAs);
sv.addEventListener("click",async function(){
if(!fh&&!NATIVE){await saveAs();return;}
var ok=await writeFile(true);
if(!ok&&!NATIVE&&API&&await relink())ok=await writeFile(false);
flash(ok?"Kaydedildi ✓":"Kaydedilemedi");
});
$("st").addEventListener("click",async function(e){
if(!(e.target.closest&&e.target.closest("[data-grant]")))return;
showStatus("İzin isteniyor…");
perm=await hasPerm(true);
if(!perm&&await relink())perm=true;
if(perm)await syncFromFile();
showStatus();
});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"&&(NATIVE||(fh&&perm))&&localStorage.getItem(KEY+":dirty")==="1")writeFile(false);});

if(NATIVE){
window.agendaAPI.init().then(function(r){

var o=null;try{o=r.text?JSON.parse(r.text):null;}catch(e){o=null;}
