<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haftalık Planlayıcı 2026–2030</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#e9edf2;--bar:#ffffff;--bar-ink:#1d2433;--bar-line:#cfd5df;--acc:#0f766e;--tab:#d3dce7;--tab-ink:#1d2433;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141b;--bar:#1a212c;--bar-ink:#e8edf4;--bar-line:#2c3646;--tab:#2c3646;--tab-ink:#e8edf4}}
:root[data-theme="dark"]{--bg:#10141b;--bar:#1a212c;--bar-ink:#e8edf4;--bar-line:#2c3646;--tab:#2c3646;--tab-ink:#e8edf4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);font-family:'IBM Plex Sans','Segoe UI',sans-serif}
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px 16px;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--bar-line)}
#bar button,#bar select{font:inherit;font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid var(--bar-line);background:var(--bar);color:var(--bar-ink);cursor:pointer;min-height:40px}
#bar button{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
#bar button:hover:not(:disabled){filter:brightness(.92)}
#bar button:disabled{opacity:.45;cursor:default}
#bar button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
#bar .hint{font-size:12px;opacity:.7}
#hb{font-size:20px;line-height:1;padding:8px 14px;min-width:48px}
#menu[hidden]{display:none}
#menu{position:absolute;top:100%;left:16px;margin-top:6px;z-index:8;display:flex;flex-direction:column;gap:6px;min-width:220px;padding:8px;background:var(--bar);border:1px solid var(--bar-line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.22)}
#menu button{width:100%;text-align:left}
#menu .zm{display:flex;gap:6px}
#menu .zm button{flex:1;text-align:center;min-width:0;padding:8px 6px}
#menu .zm #zl{flex:2}
#wrap{display:flex;justify-content:safe center;align-items:flex-start;margin:16px auto;padding:0 12px;box-sizing:border-box}
#stage{overflow:hidden;flex:none}
#tabs{flex:none;width:118px;display:flex;flex-direction:column;gap:6px;padding-top:24px}
.zm{display:flex;gap:4px}
#bar .zm button{padding:8px 12px;min-width:44px}
.tab{appearance:none;-webkit-appearance:none;border:0;font:inherit;font-size:13px;text-align:left;padding:10px 10px 10px 12px;border-radius:0 8px 8px 0;background:var(--tab);color:var(--tab-ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;box-sizing:border-box}
.tab:hover{filter:brightness(.95)}
.tabrow{display:flex;align-items:stretch;gap:2px;width:100%}
.tabrow .tab{flex:1;width:auto;min-width:0}
.tabmove{appearance:none;-webkit-appearance:none;border:0;border-radius:4px;background:var(--tab);color:var(--tab-ink);font:inherit;font-size:12px;line-height:1;width:20px;flex:none;cursor:pointer;padding:0}
.tabmove:hover{filter:brightness(.92)}
.tabmove:disabled{opacity:.25;cursor:default}
.tab.pend{background:#f5c26b;color:#4a2800}
.tab.pend.on{background:#d97706;color:#fff}
.tab.on{background:var(--acc);color:#fff;font-weight:700}
#sheet.wide{width:1600px}
#sheet{width:1123px;height:794px;box-sizing:border-box;padding:32px;display:flex;flex-direction:column;gap:14px;background:#fff;color:#1d2433;transform-origin:top left;box-shadow:0 4px 24px rgba(0,0,0,.18)}
.df{font-family:'Bricolage Grotesque','Segoe UI',sans-serif}
.top{display:flex;gap:14px;align-items:stretch}
.title{width:330px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1d2433;padding-bottom:8px}
.lab{font-size:11px;letter-spacing:3px;font-weight:700;color:#0f766e}
.dt{font-size:28px;font-weight:700;line-height:1.1;margin-top:4px}
.num{font-size:46px;font-weight:700;line-height:1;color:#0f766e;text-align:right}
.numl{font-size:10px;font-weight:700;letter-spacing:2px;text-align:right}
.panel{border:1px solid #cfd5df;border-radius:6px;padding:7px 10px}
.pl{font-size:10px;font-weight:700;letter-spacing:2px;margin-bottom:6px}
.g{display:grid;gap:2px}
.mc{padding:7px 0;text-align:center;font-size:11px;font-weight:500;border-radius:4px;cursor:pointer}
.wc{padding:4px 0;text-align:center;border-radius:4px;cursor:pointer}
.mc:hover,.wc:hover{background:rgba(15,118,110,.14)}
.mc.on:hover,.wc.on:hover{background:#0f766e}
.mc:focus-visible,.wc:focus-visible{outline:2px solid #0f766e;outline-offset:-2px}
.on{background:#0f766e;color:#fff;font-weight:700}
.days{flex:1;display:grid;grid-template-columns:repeat(5,1fr) .8fr .8fr;gap:10px;min-height:0}
.day{border:1px solid #cfd5df;border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:baseline;background:#f1f4f8;padding:8px 12px;border-bottom:1px solid #cfd5df}
.dh b{font-size:16px}.dh span{font-size:13px;color:#0f766e;font-weight:700}
.dh .dr{display:flex;align-items:center;gap:6px}
.dadd{appearance:none;-webkit-appearance:none;border:1px solid #0f766e;background:#fff;color:#0f766e;font:inherit;font-size:15px;font-weight:700;line-height:1;width:22px;height:20px;border-radius:4px;cursor:pointer;padding:0}
.dadd:hover,.dadd:focus-visible{background:#0f766e;color:#fff;outline:none}
.dadd:disabled{opacity:.3;cursor:default}
.ln{flex:1;border-bottom:1px solid #e1e5ec;display:flex;align-items:center;gap:8px;padding:0 8px}
.ln:last-child{border-bottom:0}
input[type=text]{font:inherit;font-size:13px;color:#1d2433;border:0;background:transparent;outline:none;width:100%;min-width:0;padding:0 10px}
input[type=text]:focus{background:rgba(15,118,110,.07)}
.ln input[type=text]{height:100%;padding:0 2px}
input[type=date]{font:inherit;font-size:13px;color:#1d2433;border:1px solid #cfd5df;border-radius:4px;background:#fff;height:28px;width:132px;box-sizing:border-box;padding:0 6px;flex:none}
.x{appearance:none;-webkit-appearance:none;flex:none;border:0;background:transparent;color:#aab2bf;font:inherit;font-size:18px;line-height:1;width:22px;height:22px;border-radius:4px;cursor:pointer;padding:0}
.x:hover,.x:focus-visible{color:#b42318;background:rgba(180,35,24,.08);outline:none}
.hover-tip{position:fixed;z-index:9999;display:none;max-width:min(520px,calc(100vw - 24px));padding:7px 10px;border:1px solid #cfd5df;border-radius:5px;background:#fff;color:#1d2433;box-shadow:0 3px 12px rgba(0,0,0,.18);font:13px/1.45 'IBM Plex Sans','Segoe UI',sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none}
.fu{flex:1;border:1.5px solid #0f766e;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.fh{background:#0f766e;color:#fff;padding:8px 14px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.arw{margin-left:auto;display:flex;gap:6px}
.ar{appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.65);background:transparent;color:#fff;font:inherit;font-size:18px;line-height:1;width:34px;height:24px;border-radius:4px;cursor:pointer;padding:0}
.ar:hover{background:rgba(255,255,255,.2)}
.ar:disabled{opacity:.35;cursor:default}
.cols{flex:1;display:flex;min-height:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.cols::-webkit-scrollbar{display:none}
.col{flex:0 0 33.3333%;width:33.3333%;min-width:0;max-width:33.3333%;overflow:hidden;box-sizing:border-box;scroll-snap-align:start;display:flex;flex-direction:column;padding:0 14px}
.col+.col{border-left:1.5px solid #0f766e}
.row{flex:1;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e1e5ec;min-width:0}
.row:last-child{border-bottom:0}
.row input[type=text]{height:100%;padding:0 4px;font-size:14px}
.row.mir{cursor:pointer;background:rgba(217,119,6,.07)}
.row.mir:hover,.row.mir:focus-visible{background:rgba(217,119,6,.16);outline:none}
.mir .mk{flex:none;width:16px;text-align:center;color:#b45309;font-size:13px;font-weight:700;line-height:1}
.mir .mt{flex:1 1 0;min-width:0;width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#1d2433;padding:0 4px}
.mir.sub .mt{font-size:13px;color:#4b5565}
.row.blank{cursor:default}
.cb{appearance:none;-webkit-appearance:none;flex:none;width:16px;height:16px;margin:0;border:1.5px solid #0f766e;border-radius:3px;background:#fff;cursor:pointer;display:grid;place-content:center}
.cb:checked{background:#0f766e}
.cb:checked::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb:checked + .tx{text-decoration:line-through;text-decoration-thickness:1.5px;color:#8a94a3}
.cb:checked ~ input[type=date]{color:#8a94a3}
.chead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1d2433;padding-bottom:8px}
.cn{font-family:'Bricolage Grotesque','Segoe UI',sans-serif;font-size:30px;font-weight:700;color:#1d2433;border:0;background:transparent;outline:none;width:640px;padding:0;margin-top:4px}
.cn:focus{background:rgba(15,118,110,.07)}
.dc{font:inherit;font-size:13px;border:1px solid #cfd5df;background:#fff;color:#b42318;padding:6px 12px;border-radius:6px;cursor:pointer}
.dl{width:132px;flex:none;text-align:center;font-size:11px;letter-spacing:1px;font-weight:700}
.cl{flex:1;overflow-y:auto;padding:0 14px;display:flex;flex-direction:column;min-height:0}
.cl .row{flex:none;height:40px}
.ad{font:inherit;font-size:13px;font-weight:700;border:0;border-top:1px solid #e1e5ec;background:#f6f8fa;color:#0f766e;padding:8px;cursor:pointer}
.cl .row.cr{height:auto;min-height:40px;align-items:flex-start;padding:6px 0;box-sizing:border-box}
.cl .row.cr .cb{margin-top:6px}
.cl .row.cr.sub{padding-left:30px}
.cl .row.cr .x,.cl .row.cr .sb,.cl .row.cr .sp{margin-top:3px}
.tw{flex:1;min-width:0;box-sizing:border-box;font:inherit;font-size:14px;line-height:20px;color:#1d2433;border:0;background:transparent;resize:none;overflow:hidden;padding:4px;min-height:28px;height:28px;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;display:block}
.tw:focus{background:rgba(15,118,110,.07)}
.cb:checked + .tw{text-decoration:line-through;text-decoration-thickness:1.5px;color:#8a94a3}
.sb{appearance:none;-webkit-appearance:none;flex:none;border:0;background:transparent;color:#0f766e;font:inherit;font-size:16px;line-height:1;width:22px;height:22px;border-radius:4px;cursor:pointer;padding:0}
.sb:hover,.sb:focus-visible{background:rgba(15,118,110,.12);outline:none}
.sp{flex:none;width:22px}
input.mi{}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:10000;font-family:'IBM Plex Sans','Segoe UI',sans-serif}
.mdl .box{background:#fff;color:#1d2433;border-radius:8px;padding:18px;width:360px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.mdl .mt{font-weight:700;margin-bottom:10px}
.mdl input.mi{width:100%;box-sizing:border-box;border:1px solid #cfd5df;border-radius:6px;padding:8px 10px;font-size:14px;height:auto;background:#fff}
.mdl .mb{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mdl .mb button{font:inherit;font-size:14px;padding:8px 14px;border:1px solid #cfd5df;border-radius:6px;background:#fff;color:#1d2433;cursor:pointer}
.mdl .mb button.pri{background:#0f766e;color:#fff;border-color:#0f766e;font-weight:700}
/* --- 1.8: öncelik, hatırlatma, aylık görünüm, arama, tekrarlayan görevler, özet, koyu tema --- */
:root{--s-bg:#fff;--s-ink:#1d2433;--s-line:#cfd5df;--s-line2:#e1e5ec;--s-head:#f1f4f8;--s-mut:#8a94a3;--s-field:#fff;--s-acc2:#0f766e;--s-out:#f6f8fa}
:root[data-theme="dark"]{--s-bg:#161c26;--s-ink:#e3e8ef;--s-line:#2f3a4b;--s-line2:#263040;--s-head:#1e2633;--s-mut:#6b7686;--s-field:#1e2633;--s-acc2:#2dd4bf;--s-out:#121821}
.ln{gap:4px}
.pr{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;border:0;background:transparent;border-radius:4px;cursor:pointer;padding:0;display:grid;place-content:center}
.pr::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid #aab2bf;box-sizing:border-box}
.pr.p1::before{background:#dc2626;border-color:#dc2626}.pr.p2::before{background:#f59e0b;border-color:#f59e0b}.pr.p3::before{background:#16a34a;border-color:#16a34a}
.pr:hover,.pr:focus-visible{background:rgba(15,118,110,.12);outline:none}
.ln.p1,.row.p1{box-shadow:inset 3px 0 #dc2626}.ln.p2,.row.p2{box-shadow:inset 3px 0 #f59e0b}.ln.p3,.row.p3{box-shadow:inset 3px 0 #16a34a}
.bl{appearance:none;-webkit-appearance:none;flex:none;border:0;background:transparent;color:#0f766e;font:inherit;font-size:11px;font-weight:700;line-height:1;height:20px;min-width:20px;border-radius:4px;cursor:pointer;padding:0 2px;white-space:nowrap;filter:grayscale(1);opacity:.75}
.bl.set{filter:none;opacity:1;background:rgba(15,118,110,.1)}
.bl:hover,.bl:focus-visible{background:rgba(15,118,110,.16);outline:none;filter:none;opacity:1}
.ln .pr:not(.p1):not(.p2):not(.p3),.ln .bl:not(.set){display:none}
.ln:hover .pr:not(.p1):not(.p2):not(.p3),.ln:focus-within .pr:not(.p1):not(.p2):not(.p3){display:grid}
.ln:hover .bl:not(.set),.ln:focus-within .bl:not(.set){display:inline-block}
.cl .row.cr .pr{margin-top:5px}
input[type=time]{font:inherit;font-size:13px;color:#1d2433;border:1px solid #cfd5df;border-radius:4px;background:#fff;height:28px;width:112px;box-sizing:border-box;padding:0 6px;flex:none}
.cb:checked ~ input[type=time]{color:#8a94a3}
.prg .pv{font-size:13px;margin:2px 0 6px}.prg .pv b{font-size:20px;color:var(--s-acc2)}
.pbar{height:8px;border-radius:4px;background:var(--s-line2);overflow:hidden}.pbar i{display:block;height:100%;background:#0f766e;border-radius:4px;transition:width .3s}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px solid var(--s-ink);padding-bottom:8px}
.mnav{display:flex;gap:6px;align-items:center}
.mnav button{font:inherit;font-size:14px;font-weight:700;border:1px solid #0f766e;background:var(--s-field);color:var(--s-acc2);border-radius:6px;padding:6px 12px;cursor:pointer;min-height:34px}
.mnav button:hover:not(:disabled){background:#0f766e;color:#fff}.mnav button:disabled{opacity:.35;cursor:default}
.msum{width:240px}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(5,1fr) .8fr .8fr;gap:6px;min-height:0}
.mdn{font-size:11px;font-weight:700;letter-spacing:2px;text-align:center;padding:2px 0;color:var(--s-acc2)}
.mcell{border:1px solid var(--s-line);border-radius:6px;padding:4px 6px;display:flex;flex-direction:column;min-height:0;overflow:hidden;cursor:pointer;background:var(--s-bg)}
.mcell:hover,.mcell:focus-visible{border-color:#0f766e;outline:none;box-shadow:0 0 0 1px #0f766e}
.mcell.out{background:var(--s-out);opacity:.6}
.mcell.today{border:2px solid #0f766e;padding:3px 5px}
.mcell.today .mdh b{background:#0f766e;color:#fff;border-radius:10px;padding:0 6px}
.mdh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.mdh b{font-size:14px}.mdh span{font-size:10px;font-weight:700;color:var(--s-mut);letter-spacing:1px}
.mnotes{display:flex;flex-direction:column;gap:1px;min-height:0;overflow:hidden}
.mn{font-size:11.5px;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;border-radius:3px;border-left:3px solid transparent}
.mn.done{text-decoration:line-through;color:var(--s-mut)}
.mn.p1{border-left-color:#dc2626}.mn.p2{border-left-color:#f59e0b}.mn.p3{border-left-color:#16a34a}
.mn.pg{color:#b45309}.mn.pg:hover{background:rgba(217,119,6,.14)}
.mn .tm{font-weight:700;color:var(--s-acc2);margin-right:3px}
.mmore{font-size:10.5px;font-weight:700;color:var(--s-mut);padding:0 3px}
@keyframes hl{0%,30%{background:rgba(245,194,107,.75)}100%{background:transparent}}
.hl{animation:hl 1.8s ease-out}
.mdl .box.wide{width:560px}
.mdl .box select,.mdl .box input[type=time]{font:inherit;font-size:14px;border:1px solid #cfd5df;border-radius:6px;padding:6px 8px;background:#fff;color:#1d2433;height:36px;box-sizing:border-box}
.mdl .note{font-size:12px;opacity:.75;margin-top:8px;line-height:1.4}
.mdl .frm{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mdl .frm .mi{flex:1 1 100%}
.mdl .frm button{font:inherit;font-size:14px;padding:6px 14px;border:1px solid #0f766e;border-radius:6px;background:#0f766e;color:#fff;font-weight:700;cursor:pointer}
.rl{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.rli{display:flex;align-items:center;gap:8px;border:1px solid #cfd5df;border-radius:6px;padding:6px 8px;font-size:13px}
.rli .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rli .rk{font-size:11px;font-weight:700;color:#0f766e;white-space:nowrap}
.rli button{font:inherit;font-size:12px;border:1px solid #cfd5df;background:transparent;color:#b42318;border-radius:4px;padding:3px 8px;cursor:pointer}
.sres{max-height:52vh;overflow-y:auto;margin-top:10px;display:flex;flex-direction:column;gap:2px}
.sr{appearance:none;-webkit-appearance:none;text-align:left;font:inherit;font-size:13px;border:0;border-radius:6px;background:transparent;color:inherit;padding:7px 8px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.sr:hover,.sr:focus-visible,.sr.sel{background:rgba(15,118,110,.12);outline:none}
.sr small{font-size:11px;font-weight:700;color:#0f766e;letter-spacing:.5px}
.sr.done span{text-decoration:line-through;opacity:.6}
.sr mark{background:rgba(245,194,107,.6);color:inherit;border-radius:2px}
.sempty{font-size:13px;opacity:.65;padding:8px}
:root[data-theme="dark"] #sheet{background:var(--s-bg);color:var(--s-ink);box-shadow:0 4px 24px rgba(0,0,0,.5)}
:root[data-theme="dark"] .title,:root[data-theme="dark"] .chead{border-bottom-color:var(--s-ink)}
:root[data-theme="dark"] .panel,:root[data-theme="dark"] .day{border-color:var(--s-line)}
:root[data-theme="dark"] .dh{background:var(--s-head);border-bottom-color:var(--s-line)}
:root[data-theme="dark"] .ln,:root[data-theme="dark"] .row{border-bottom-color:var(--s-line2)}
:root[data-theme="dark"] input[type=text],:root[data-theme="dark"] .tw,:root[data-theme="dark"] .cn,:root[data-theme="dark"] .mir .mt{color:var(--s-ink)}
:root[data-theme="dark"] .mir.sub .mt{color:#aab4c3}
:root[data-theme="dark"] input[type=date],:root[data-theme="dark"] input[type=time]{background:var(--s-field);color:var(--s-ink);border-color:var(--s-line);color-scheme:dark}
:root[data-theme="dark"] .cb,:root[data-theme="dark"] .dadd{background:var(--s-field)}
:root[data-theme="dark"] .cb:checked{background:#0f766e}
:root[data-theme="dark"] .dadd:hover{background:#0f766e}
:root[data-theme="dark"] .dc{background:var(--s-field);border-color:var(--s-line);color:#f87171}
:root[data-theme="dark"] .ad{background:var(--s-head);border-top-color:var(--s-line2);color:var(--s-acc2)}

<script>
var SH=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
var FULL=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var DAYS=["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
var KEY="haftalik-plan-2026-2030";
function $(i){return document.getElementById(i);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function p2(n){return (n<10?"0":"")+n;}
function dkey(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var M=[];
for(var k=0;;k++){var d0=new Date(2025,11,29+7*k);if(d0.getFullYear()>2031)break;var th=addDays(d0,3),y=th.getFullYear();var doy=Math.round((new Date(y,th.getMonth(),th.getDate())-new Date(y,0,1))/864e5);M.push({d:d0,y:y,w:Math.floor(doy/7)+1});}
var CNT={};M.forEach(function(e){CNT[e.y]=(CNT[e.y]||0)+1;});
var START=new Date(2025,11,29),L=[];
M.forEach(function(e,i){if(e.y<=2030&&e.d>=START)L.push(i);});
function rng(m){var f=addDays(m,6);return m.getMonth()===f.getMonth()?m.getDate()+"–"+f.getDate()+" "+SH[m.getMonth()]:m.getDate()+" "+SH[m.getMonth()]+"–"+f.getDate()+" "+SH[f.getMonth()];}
var S={};
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){S={};}
var BOOT=null;try{if(window.agendaAPI&&window.agendaAPI.initSync)BOOT=window.agendaAPI.initSync();}catch(e){BOOT=null;}
try{if(BOOT&&BOOT.mode==="sqlite"&&localStorage.getItem(KEY+":dirty")!=="1"){var bo=BOOT.text?JSON.parse(BOOT.text):null;S=(bo&&bo.app==="haftalik-plan"&&bo.data&&typeof bo.data==="object")?bo.data:{};localStorage.setItem(KEY,JSON.stringify(S));}}catch(e){}
function saveLocal(clean){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+":dirty",clean?"0":"1");}catch(e){}}
function save(){saveLocal(false);queueFile();}
var cur=0,view="week";
function getList(){return Array.isArray(S["cust:list"])?S["cust:list"]:[];}
function ncols(pre){return S[pre+":ncols"]||3;}
function weekOfToday(){var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());var p=0;for(var q=0;q<L.length;q++){if(t>=M[L[q]].d)p=q;}return p;}
function weekHasData(ix){var pre=dkey(M[ix].d);if(S[pre+":v"])return true;var n=ncols(pre);for(var c=0;c<n;c++)for(var r=0;r<7;r++){if(String(S[pre+":t"+c+":"+r]||"").trim())return true;}return false;}
function doneIn(sp,t){var n=ncols(sp),done=false,found=false;for(var c=0;c<n;c++)for(var r=0;r<7;r++){if(String(S[sp+":t"+c+":"+r]||"")===t){found=true;if(S[sp+":c"+c+":"+r])done=true;else return false;}}if(!found)return Array.isArray(S[sp+":h"])&&S[sp+":h"].indexOf(t)>=0;return done;}
function shiftUpWeek(pre,c,r){var ks=["t","c","o","p","r"];
for(var q=r;q<6;q++)ks.forEach(function(k){var a=pre+":"+k+c+":"+(q+1),b=pre+":"+k+c+":"+q,v=S[a];if(v)S[b]=v;else delete S[b];});
ks.forEach(function(k){delete S[pre+":"+k+c+":6"];});}
function reconcileCarry(upto){var ch=false;
for(var q=0;q<=upto;q++){var pre=dkey(M[L[q]].d);if(S[pre+":v"]!==1)continue;var n=ncols(pre);
for(var c=0;c<n;c++){var r=0;while(r<7){var ok=pre+":o"+c+":"+r,sp=S[ok];
if(!sp){r++;continue;}
var t=String(S[pre+":t"+c+":"+r]||"");
if(!t){delete S[ok];ch=true;r++;continue;}
if(S[pre+":c"+c+":"+r]){r++;continue;}
if(doneIn(sp,t)){var h=Array.isArray(S[pre+":h"])?S[pre+":h"]:[];if(h.indexOf(t)<0)h.push(t);S[pre+":h"]=h;shiftUpWeek(pre,c,r);ch=true;continue;}
r++;}}}
if(ch)save();}
function weekTexts(sp){var n=ncols(sp),o=[];for(var c=0;c<n;c++)for(var r=0;r<7;r++){var t=String(S[sp+":t"+c+":"+r]||"");if(t.trim())o.push(t);}return o;}
function ensureCarry(p){
reconcileCarry(p);
var pre=dkey(M[L[p]].d),old=S[pre+":g"],first=!Array.isArray(old),seen=first?[]:old.slice(),changed=first;
var src=-1;for(var q=p-1;q>=0;q--){if(weekHasData(L[q])){src=q;break;}}
if(src>=0){
var sp=dkey(M[L[src]].d),sn=ncols(sp),items=[],meta={};
for(var c=0;c<sn;c++)for(var r=0;r<7;r++){var t=String(S[sp+":t"+c+":"+r]||"");if(t.trim()&&!S[sp+":c"+c+":"+r]&&items.indexOf(t)<0){items.push(t);meta[t]={p:S[sp+":p"+c+":"+r],r:S[sp+":r"+c+":"+r]};}}
var have=weekTexts(pre);
if(first&&S[pre+":v"]===1){
items.forEach(function(t){if(seen.indexOf(t)<0)seen.push(t);});
have.forEach(function(t){if(seen.indexOf(t)<0)seen.push(t);});
}else{
var add=items.filter(function(t){return seen.indexOf(t)<0&&have.indexOf(t)<0;});
items.forEach(function(t){if(seen.indexOf(t)<0){seen.push(t);changed=true;}});
if(add.length){
var nc=ncols(pre),slots=[];
for(var c2=0;c2<nc;c2++)for(var r2=0;r2<7;r2++){if(!String(S[pre+":t"+c2+":"+r2]||"").trim())slots.push([c2,r2]);}
while(slots.length<add.length){for(var r3=0;r3<7;r3++)slots.push([nc,r3]);nc++;}
add.forEach(function(t,i){var sk=slots[i][0]+":"+slots[i][1],mt=meta[t]||{};S[pre+":t"+sk]=t;delete S[pre+":c"+sk];S[pre+":o"+sk]=sp;
if(mt.p)S[pre+":p"+sk]=mt.p;else delete S[pre+":p"+sk];if(mt.r)S[pre+":r"+sk]=mt.r;else delete S[pre+":r"+sk];});
if(nc>3)S[pre+":ncols"]=nc;
changed=true;
}
}
}
if(changed||S[pre+":v"]!==1){S[pre+":g"]=seen;S[pre+":v"]=1;save();}
}
function mirrorItems(){var out=[];
getList().forEach(function(c){var b="cust:"+c.id+":",n=S[b+"n"]||14,pShown=false;
for(var r=0;r<n;r++){var t=String(S[b+"t:"+r]||"").trim(),sub=!!S[b+"i:"+r],done=!!S[b+"c:"+r];
if(!t){if(!sub)pShown=false;continue;}
if(!sub){pShown=!done;if(done)continue;out.push({id:c.id,sub:false,text:c.name+": "+t});}
else{if(done)continue;out.push({id:c.id,sub:true,text:"↳ "+(pShown?"":c.name+": ")+t});}}});
return out;}
function fuCols(ix,pre){
var mir=M[ix].d>=M[L[weekOfToday()]].d?mirrorItems():[],n=ncols(pre),seq=[];
mir.forEach(function(m){seq.push({m:m});});
for(var c=0;c<n;c++)for(var r=0;r<7;r++)seq.push({c:c,r:r});
var nc=Math.ceil(seq.length/7),cols="";
for(var k=0;k<nc;k++){var rows="";
for(var j=0;j<7;j++){var it=seq[k*7+j];
if(!it){rows+='<div class="row blank"></div>';}
else if(it.m){rows+='<div class="row mir'+(it.m.sub?" sub":"")+'" role="button" tabindex="0" data-gopage="'+esc(it.m.id)+'" title="'+esc(it.m.text)+' — sayfada düzenle"><span class="mk" aria-hidden="true">↗</span><span class="mt">'+esc(it.m.text)+'</span></div>';}
else{var pk=pre+':p'+it.c+':'+it.r,rk=pre+':r'+it.c+':'+it.r,pv=S[pk]||0,rv=S[rk]||"";rows+='<div class="row'+(pv?' p'+pv:'')+'"><input type="checkbox" class="cb" data-k="'+pre+':c'+it.c+':'+it.r+'" aria-label="Tamamlandı"><input type="text" class="tx" data-k="'+pre+':t'+it.c+':'+it.r+'" aria-label="Takip konusu"><button type="button" class="pr np'+(pv?' p'+pv:'')+'" data-prio="'+pk+'" title="Öncelik: '+PRN[pv]+' (tıklayınca değişir)" aria-label="Öncelik"></button><button type="button" class="bl np'+(rv?' set':'')+'" data-bell="'+rk+'" title="'+(rv?'Hatırlatma: '+esc(fmtRem(rv))+' (değiştir)':'Hatırlatma ekle')+'" aria-label="Hatırlatma">🔔'+(rv?esc(fmtRem(rv)):'')+'</button><button type="button" class="x" data-del="t|'+it.c+'|'+it.r+'" aria-label="Satırı sil" title="Satırı sil">×</button></div>';}}
cols+='<div class="col">'+rows+'</div>';}
return cols;}
function build(ix){
var e=M[ix],mon=e.d,fri=addDays(mon,6),anc=addDays(mon,3),Y=e.y,wk=e.w,pre=dkey(mon);
var wd=[0,1,2,3,4,5,6].map(function(i){return addDays(mon,i);});
var hm={};wd.forEach(function(d){if(d.getFullYear()===Y)hm[d.getMonth()]=1;});
var title;
if(mon.getMonth()===fri.getMonth())title=mon.getDate()+" – "+fri.getDate()+" "+FULL[mon.getMonth()]+" "+fri.getFullYear();
else if(mon.getFullYear()===fri.getFullYear())title=mon.getDate()+" "+FULL[mon.getMonth()]+" – "+fri.getDate()+" "+FULL[fri.getMonth()]+" "+fri.getFullYear();
else title=mon.getDate()+" "+FULL[mon.getMonth()]+" "+mon.getFullYear()+" – "+fri.getDate()+" "+FULL[fri.getMonth()]+" "+fri.getFullYear();
var tsz=title.length<22?28:19;
var mc=SH.map(function(m,i){return '<div class="mc'+(hm[i]?' on':'')+'" role="button" tabindex="0" data-mon="'+i+'" data-y="'+Y+'" title="'+FULL[i]+' '+Y+'\'e git">'+m+'</div>';}).join("");
var ws=[];M.forEach(function(x,j){for(var q=0;q<7;q++){var d=addDays(x.d,q);if(d.getMonth()===anc.getMonth()&&d.getFullYear()===Y){ws.push(j);break;}}});
var wc=ws.map(function(j){return '<div class="wc'+(j===ix?' on':'')+'" role="button" tabindex="0" data-wk="'+j+'" title="'+M[j].w+'. haftaya git"><div style="font-size:13px;font-weight:700">H'+M[j].w+'</div><div style="font-size:9px">'+rng(M[j].d)+'</div></div>';}).join("");
var days=wd.map(function(d,i){var l="",dn=S[pre+":dn"+i]||9;for(var r=1;r<=dn;r++){var pv=S[pre+':dp'+i+':'+r]||0,tm=S[pre+':dr'+i+':'+r]||"";l+='<div class="ln'+(pv?' p'+pv:'')+'"><input type="checkbox" class="cb" data-k="'+pre+':dc'+i+':'+r+'" aria-label="Tamamlandı"><input type="text" class="tx" data-k="'+pre+':d'+i+':'+r+'" aria-label="'+DAYS[i]+' not '+r+'"><button type="button" class="pr np'+(pv?' p'+pv:'')+'" data-prio="'+pre+':dp'+i+':'+r+'" title="Öncelik: '+PRN[pv]+' (tıklayınca değişir)" aria-label="Öncelik"></button><button type="button" class="bl np'+(tm?' set':'')+'" data-bell="'+pre+':dr'+i+':'+r+'" title="'+(tm?'Hatırlatma: '+tm+' (değiştir)':'Hatırlatma ekle')+'" aria-label="Hatırlatma">🔔'+(tm?esc(tm):'')+'</button><button type="button" class="x" data-del="d|'+i+'|'+r+'" aria-label="Satırı sil" title="Satırı sil">×</button></div>';}
return '<div class="day'+(dkey(d)===dkey(new Date())?' today':'')+'"><div class="dh"><b class="df">'+DAYS[i]+'</b><span class="dr">'+d.getDate()+' '+SH[d.getMonth()]+'<button type="button" class="dadd np" data-addday="'+i+'" title="Bu güne satır ekle" aria-label="Bu güne satır ekle"'+(dn>=14?' disabled':'')+'>+</button></span></div>'+l+'</div>';}).join("");
var cols=fuCols(ix,pre);
return '<div class="top"><div class="title"><div><div class="lab">HAFTALIK PLAN</div><div class="dt df" style="font-size:'+tsz+'px">'+title+'</div></div><div><div class="num df">'+wk+'</div><div class="numl">HAFTA / '+CNT[Y]+'</div></div></div>'
+'<div class="panel" style="flex:1"><div class="pl">AY — '+Y+'</div><div class="g" style="grid-template-columns:repeat(12,1fr)">'+mc+'</div></div>'
+'<div class="panel" style="width:340px"><div class="pl">'+FULL[anc.getMonth()].toLocaleUpperCase("tr")+' HAFTALARI</div><div class="g" style="grid-template-columns:repeat('+ws.length+',1fr)">'+wc+'</div></div>'
+'<div class="panel prg" style="width:190px"><div class="pl">BU HAFTA</div>'+progHtml(weekProgress(pre))+'</div></div>'
+'<div class="days">'+days+'</div><div class="fu"><div class="fh df"><span>Takip Edilecek Konular</span><span class="arw np"><button type="button" class="ar" data-nav="-1" title="Sola kaydır" aria-label="Sola kaydır">‹</button><button type="button" class="ar" data-nav="1" title="Sağa kaydır (sonda yeni sütun açar)" aria-label="Sağa kaydır">›</button></span></div><div class="cols">'+cols+'</div></div>';
}
function buildCust(c){
var id=c.id,n=S["cust:"+id+":n"]||14,rows="";
for(var r=0;r<n;r++){var b="cust:"+id+":";var sub=S[b+"i:"+r]?1:0;var pv=S[b+"p:"+r]||0;rows+='<div class="row cr'+(sub?" sub":"")+(pv?' p'+pv:'')+'"><input type="checkbox" class="cb" data-k="'+b+'c:'+r+'" aria-label="Tamamlandı"><textarea class="tw" rows="1" data-k="'+b+'t:'+r+'" aria-label="Konu"></textarea><button type="button" class="pr np'+(pv?' p'+pv:'')+'" data-prio="'+b+'p:'+r+'" title="Öncelik: '+PRN[pv]+' (tıklayınca değişir)" aria-label="Öncelik"></button><input type="date" data-k="'+b+'a:'+r+'" aria-label="Tarih"><input type="time" data-k="'+b+'h:'+r+'" aria-label="Hatırlatma saati" title="Hatırlatma saati (tarih de seçili olmalı)">'+(sub?'<span class="sp"></span>':'<button type="button" class="sb np" data-sub="'+id+'|'+r+'" aria-label="Alt madde ekle" title="Alt madde ekle">↳</button>')+'<button type="button" class="x" data-del="u|'+id+'|'+r+'" aria-label="Satırı sil" title="Satırı sil">×</button></div>';}
return '<div class="chead"><div><div class="lab">SAYFA</div><input id="cname" class="cn" type="text" value="'+esc(c.name)+'" aria-label="Sayfa adı"></div><button type="button" class="dc np" data-delc="'+id+'">Sayfayı sil</button></div>'
+'<div class="fu"><div class="fh df"><span style="flex:1">Takip Edilecek Konular</span><span style="width:18px;flex:none"></span><span class="dl">TARİH</span><span class="dl" style="width:112px">🔔 SAAT</span><span style="width:50px;flex:none"></span></div><div class="cl">'+rows+'</div><button type="button" class="ad np" data-addrow="'+id+'">+ Satır ekle</button></div>';
}
var ZOOM=null;try{var zz=parseFloat(localStorage.getItem(KEY+":zoom"));if(zz>0)ZOOM=zz;}catch(e){}
var SHW=1123;
function autoScale(){var bh=$("bar").offsetHeight||60;return Math.min(1,(window.innerWidth-24)/(SHW+118),(window.innerHeight-bh-40)/794);}
function fit(){var s=ZOOM||autoScale();$("stage").style.width=(SHW*s)+"px";$("stage").style.height=(794*s)+"px";$("sheet").style.transform="scale("+s+")";$("tabs").style.zoom=s;$("zl").textContent=ZOOM?Math.round(s*100)+"%":"Sığdır";}
function setZoom(z){ZOOM=z;try{if(z)localStorage.setItem(KEY+":zoom",String(z));else localStorage.removeItem(KEY+":zoom");}catch(e){}fit();}
function stepZoom(d){var n=Math.round(((ZOOM||autoScale())+d)*100)/100;setZoom(Math.max(0.4,Math.min(2,n)));}
function restore(sh){sh.querySelectorAll("[data-k]").forEach(function(el){var v=S[el.getAttribute("data-k")];if(v===undefined)return;if(el.type==="checkbox")el.checked=!!v;else el.value=v;});}
function pendingCust(id){var b="cust:"+id+":",n=S[b+"n"]||14;for(var r=0;r<n;r++){var t=S[b+"t:"+r];if(t&&String(t).trim()&&!S[b+"c:"+r])return true;}return false;}
function updTabs(){var l=document.querySelectorAll("#tabs [data-tab]");for(var i=0;i<l.length;i++){var id=l[i].getAttribute("data-tab");if(id!=="week"&&id!=="month")l[i].classList.toggle("pend",pendingCust(id));}}

// ===== Arama =====
var lastQ="";
function searchAll(q){q=q.toLocaleLowerCase("tr");var out=[];if(!q)return out;var names={};getList().forEach(function(c){names[c.id]=c.name;});
Object.keys(S).forEach(function(k){var v=S[k];if(typeof v!=="string"||!v.trim()||v.toLocaleLowerCase("tr").indexOf(q)<0)return;var mm,ix;
if((mm=/^(\d{4}-\d\d-\d\d):d(\d):(\d+)$/.exec(k))){ix=PRE[mm[1]];if(ix===undefined||L.indexOf(ix)<0||+mm[3]>(S[mm[1]+":dn"+mm[2]]||9))return;
var d=addDays(M[ix].d,+mm[2]);out.push({s:dkey(d),lab:d.getDate()+" "+FULL[d.getMonth()]+" "+d.getFullYear()+" · "+DAYS[+mm[2]],t:v,done:!!S[mm[1]+":dc"+mm[2]+":"+mm[3]],go:{kind:"week",p:L.indexOf(ix),k:k}});}
else if((mm=/^(\d{4}-\d\d-\d\d):t(\d+):(\d+)$/.exec(k))){ix=PRE[mm[1]];if(ix===undefined||L.indexOf(ix)<0||+mm[2]>=ncols(mm[1]))return;
out.push({s:mm[1],lab:M[ix].y+" · "+M[ix].w+". hafta ("+rng(M[ix].d)+") · Takip",t:v,done:!!S[mm[1]+":c"+mm[2]+":"+mm[3]],go:{kind:"week",p:L.indexOf(ix),k:k}});}
else if((mm=/^cust:([^:]+):t:(\d+)$/.exec(k))){if(!names.hasOwnProperty(mm[1])||+mm[2]>=(S["cust:"+mm[1]+":n"]||14))return;var a=S["cust:"+mm[1]+":a:"+mm[2]]||"";
out.push({s:"9999"+a,lab:"Sayfa · "+names[mm[1]]+(a?" · "+a.split("-").reverse().join("."):""),t:v,done:!!S["cust:"+mm[1]+":c:"+mm[2]],go:{kind:"page",id:mm[1],k:k}});}});
out.sort(function(a,b){return a.s<b.s?1:a.s>b.s?-1:0;});return out;}
function openSearch(){if(document.querySelector(".mdl"))return;var o=document.createElement("div");o.className="mdl";
o.innerHTML='<div class="box wide"><div class="mt">Tüm notlarda ara</div><input type="text" class="mi" placeholder="Aranacak kelime…" aria-label="Ara"><div class="sres"></div><div class="mb"><button type="button" data-c="1">Kapat</button></div></div>';
var inp=o.querySelector(".mi"),res=o.querySelector(".sres"),items=[];
function hlt(t,q){var lo=t.toLocaleLowerCase("tr");if(lo.length!==t.length||!q)return esc(t);var r="",i=0,j;while((j=lo.indexOf(q,i))>=0){r+=esc(t.slice(i,j))+"<mark>"+esc(t.slice(j,j+q.length))+"</mark>";i=j+q.length;}return r+esc(t.slice(i));}
function run(){var q=inp.value.trim();lastQ=inp.value;items=searchAll(q);
if(!q){res.innerHTML='<div class="sempty">Haftalık notlarda, takip konularında ve sayfalarda arar.</div>';return;}
if(!items.length){res.innerHTML='<div class="sempty">Sonuç bulunamadı.</div>';return;}
var ql=q.toLocaleLowerCase("tr"),h='<div class="sempty">'+items.length+' sonuç</div>';
items.slice(0,150).forEach(function(x,i){h+='<button type="button" class="sr'+(x.done?' done':'')+'" data-i="'+i+'"><small>'+esc(x.lab)+'</small><span>'+hlt(x.t,ql)+'</span></button>';});
if(items.length>150)h+='<div class="sempty">İlk 150 sonuç gösteriliyor.</div>';res.innerHTML=h;}
function close(){document.removeEventListener("keydown",kd,true);o.remove();}
function pick(i){var x=items[i];if(!x)return;close();goTarget(x.go);}
function kd(e){if(e.key==="Escape"){e.preventDefault();close();return;}
var bs=[].slice.call(res.querySelectorAll(".sr")),ci=bs.indexOf(document.activeElement);
if(e.key==="ArrowDown"&&bs.length){e.preventDefault();bs[Math.min(bs.length-1,ci+1)].focus();}
else if(e.key==="ArrowUp"&&bs.length){e.preventDefault();if(ci<=0)inp.focus();else bs[ci-1].focus();}
else if(e.key==="Enter"&&e.target===inp){e.preventDefault();pick(0);}}
inp.addEventListener("input",run);
o.addEventListener("click",function(e){if(e.target===o||e.target.hasAttribute("data-c")){close();return;}var b=e.target.closest(".sr");if(b)pick(+b.getAttribute("data-i"));});
document.addEventListener("keydown",kd,true);document.body.appendChild(o);inp.value=lastQ;run();inp.focus();inp.select();}
$("srch").addEventListener("click",openSearch);
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&(e.key==="f"||e.key==="F")){e.preventDefault();openSearch();}});

// ===== Tema =====
var THM="auto";try{THM=localStorage.getItem(KEY+":theme")||"auto";}catch(e){}
var THN={auto:"Otomatik",light:"Açık",dark:"Koyu"};if(!THN[THM])THM="auto";
var MQ=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function applyTheme(){var eff=THM==="auto"?(MQ&&MQ.matches?"dark":"light"):THM;document.documentElement.setAttribute("data-theme",eff);$("thm").textContent="Tema: "+THN[THM];}
if(MQ){try{MQ.addEventListener("change",function(){if(THM==="auto")applyTheme();});}catch(e){}}
$("thm").addEventListener("click",function(){THM=THM==="auto"?"light":THM==="light"?"dark":"auto";try{localStorage.setItem(KEY+":theme",THM);}catch(e){}applyTheme();});
applyTheme();

// ===== Masaüstü ayarları (Windows ile başlat, tepsi) =====
var SET=null;
function drawSet(st){if(!st)return;SET=st;var as=$("as"),tb=$("trb");as.hidden=st.platform!=="win32";tb.hidden=false;
as.textContent=st.store?"Windows ile başlat (Ayarlar'da)":"Windows ile başlat: "+(st.autostart?"Açık ✓":"Kapalı");
tb.textContent="Kapatınca tepside çalış: "+(st.tray?"Açık ✓":"Kapalı");}
if(NATIVE&&window.agendaAPI.settings){window.agendaAPI.settings().then(drawSet).catch(function(){});
$("as").addEventListener("click",function(){window.agendaAPI.setSetting("autostart",!(SET&&SET.autostart)).then(drawSet).catch(function(){});});
$("trb").addEventListener("click",function(){window.agendaAPI.setSetting("tray",!(SET&&SET.tray)).then(drawSet).catch(function(){});});}
if(NATIVE){
window.agendaAPI.init().then(function(r){
filePath=r.path;fileName=r.name;
var o=null;try{o=r.text?JSON.parse(r.text):null;}catch(e){o=null;}
if(valid(o)&&localStorage.getItem(KEY+":dirty")!=="1"){S=o.data;lastSaved=o.savedAt||0;saveLocal(true);}
render(weekOfToday());startReminders();
if(!valid(o)||localStorage.getItem(KEY+":dirty")==="1")writeFile(false);else showStatus();
if(r.mode==="json"&&r.error)showStatus("SQLite başlatılamadı, geçici olarak JSON ile devam ediliyor: "+r.error);
}).catch(function(){render(weekOfToday());startReminders();});
}else{render(weekOfToday());startReminders();}
</script>
</body>
</html>
